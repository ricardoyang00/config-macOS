name: Update "Updated" badge

on:
  schedule:
    - cron: "0 3 1 * *" 
  workflow_dispatch:       

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download badge for the current month
        run: |
          LABEL=$(date -u +'%b%%20%Y')   # e.g. Nov%202026
          mkdir -p svg
          curl -fsSL "https://img.shields.io/badge/Updated-${LABEL}-brightgreen" -o svg/updated.svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- svg/updated.svg && git ls-files --error-unmatch svg/updated.svg >/dev/null 2>&1; then
            echo "Badge already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add svg/updated.svg
          git commit -m "chore: update badge to $(date -u +'%b %Y')"
          git push
